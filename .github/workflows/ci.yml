name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.6.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:types
      - run: npm run build
      - run: npm run test:compiled
